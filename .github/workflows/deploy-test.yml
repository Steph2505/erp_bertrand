name: Deploy — test.espacemokolodobala.site

on:
  push:
    branches: [test]
  workflow_dispatch:

# Recette : on ne coupe jamais un déploiement en cours, un testeur peut être
# en train de dérouler un scénario.
concurrency:
  group: deploy-espacemokolodobala-test
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      env_name:    test
      remote_path: /home3/sc1zeucoder/test.espacemokolodobala.site/
      app_url:     https://test.espacemokolodobala.site
      seed:        true
      # test rejoue les migrations sur des données persistantes, exactement
      # comme la prod : c'est là qu'une migration destructive doit se voir.
      backup:      true
