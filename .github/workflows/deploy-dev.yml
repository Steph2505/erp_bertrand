name: Deploy — dev.espacemokolodobala.com

on:
  push:
    branches: [dev]
  workflow_dispatch:

# cancel-in-progress: false, même sur dev. Annuler un déploiement en cours
# peut le tuer entre « artisan down » et « artisan up » : le site resterait
# fermé. On préfère laisser finir — ça dure ~3 min.
# Les runs suivants sont de toute façon sérialisés par le mutex SSH
# o2switch-ssh-sc1zeucoder défini dans deploy.yml.
concurrency:
  group: deploy-espacemokolodobala-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      env_name:    dev
      remote_path: /home3/sc1zeucoder/dev.espacemokolodobala.com/
      app_url:     https://dev.espacemokolodobala.com
      seed:        true
      # Pas de dump : la base dev est jetable, et un mysqldump à chaque push
      # ralentit la boucle de feedback pour rien.
      backup:      false
